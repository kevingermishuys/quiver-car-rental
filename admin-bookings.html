<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="robots" content="noindex, nofollow"/><link rel="stylesheet" href="_next/static/css/a8dc9301f26d5d79.css" data-precedence="next"/><title>Booking Requests — Quiver Car Rental</title>
<style>
  body{background:#181210}
  .bkg-card{border:1px solid #e7dfd3}
  .bkg-badge{display:inline-flex;align-items:center;border-radius:9999px;padding:.2rem .65rem;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  .bkg-badge.held{background:#fef3c7;color:#92400e;}
  .bkg-badge.confirmed{background:#dcfce7;color:#166534;}
  .bkg-badge.cancelled{background:#fee2e2;color:#991b1b;}
  .bkg-badge.expired{background:#e5e7eb;color:#374151;}
  .bkg-dep{display:inline-flex;align-items:center;border-radius:9999px;padding:.2rem .65rem;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  .bkg-dep.paid{background:#dcfce7;color:#166534;}
  .bkg-dep.unpaid{background:#fee2e2;color:#991b1b;}
</style>
<link rel="icon" href="favicon.ico" sizes="any"/><link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png"/><link rel="icon" href="favicon-16x16.png" sizes="16x16" type="image/png"/><link rel="apple-touch-icon" href="apple-touch-icon.png"/></head><body class="min-h-dvh bg-ink-950">
<div class="container-q py-10 max-w-[72rem]">
  <h1 class="font-display text-3xl text-sand-50 mb-2">Booking Requests</h1>
  <p class="text-sm text-ink-400 mb-8">Not public, not linked from the site. Bookmark this page. Held bookings expire automatically after 48 hours if not confirmed.</p>

  <div id="gate" class="rounded-sm border border-ink-800 bg-ink-900 p-6 max-w-[28rem]">
    <label class="block text-sm text-sand-200 mb-2" for="token">Admin token</label>
    <input id="token" type="password" class="w-full rounded-sm border border-ink-700 bg-ink-950 px-4 py-3 text-sand-50" placeholder="Paste your admin token"/>
    <button id="enter" class="mt-4 inline-flex min-h-[44px] items-center justify-center rounded-sm bg-sun-600 px-6 text-sm font-semibold uppercase tracking-[0.1em] text-white hover:bg-sun-700">Enter</button>
    <p id="gate-error" class="mt-3 text-sm text-red-400" hidden>Wrong token, or a network error — try again.</p>
  </div>

  <div id="panel" hidden>
    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
      <div class="flex gap-2 flex-wrap" id="tabs">
        <button data-status="held" class="tab-btn px-4 py-2 text-sm rounded-sm bg-sun-600 text-white">Held</button>
        <button data-status="confirmed" class="tab-btn px-4 py-2 text-sm rounded-sm bg-ink-900 text-sand-200">Confirmed</button>
        <button data-status="cancelled" class="tab-btn px-4 py-2 text-sm rounded-sm bg-ink-900 text-sand-200">Cancelled</button>
        <button data-status="all" class="tab-btn px-4 py-2 text-sm rounded-sm bg-ink-900 text-sand-200">All</button>
      </div>
      <button id="refresh" class="text-sm text-sand-200 underline">Refresh</button>
    </div>
    <div id="list" class="space-y-4"></div>
    <p id="empty" class="text-ink-400" hidden>Nothing here.</p>
  </div>
</div>

<script>
(function(){
  var API_BASE = '/api/admin/bookings';
  var token = sessionStorage.getItem('qcr_admin_token') || '';
  var gate = document.getElementById('gate');
  var panel = document.getElementById('panel');
  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var currentStatus = 'held';
  var allBookings = [];

  function showPanel(){
    gate.hidden = true;
    panel.hidden = false;
    load();
  }

  document.getElementById('enter').addEventListener('click', function(){
    var val = document.getElementById('token').value.trim();
    if (!val) return;
    token = val;
    sessionStorage.setItem('qcr_admin_token', token);
    testToken();
  });

  function testToken(){
    fetch(API_BASE + '?token=' + encodeURIComponent(token))
      .then(function(r){
        if (!r.ok) throw new Error('bad token');
        return r.json();
      })
      .then(function(data){
        allBookings = data.bookings || [];
        showPanel();
      })
      .catch(function(){
        document.getElementById('gate-error').hidden = false;
        sessionStorage.removeItem('qcr_admin_token');
      });
  }

  if (token) testToken();

  document.getElementById('refresh').addEventListener('click', load);

  document.getElementById('tabs').addEventListener('click', function(e){
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    currentStatus = btn.dataset.status;
    document.querySelectorAll('.tab-btn').forEach(function(b){
      b.className = 'tab-btn px-4 py-2 text-sm rounded-sm ' + (b === btn ? 'bg-sun-600 text-white' : 'bg-ink-900 text-sand-200');
    });
    render();
  });

  function load(){
    fetch(API_BASE + '?token=' + encodeURIComponent(token))
      .then(function(r){ return r.json(); })
      .then(function(data){
        allBookings = data.bookings || [];
        render();
      });
  }

  function effectiveStatus(b){
    if (b.status === 'held' && b.hold_expires_at && new Date(b.hold_expires_at + 'Z').getTime() < Date.now()) {
      return 'expired';
    }
    return b.status;
  }

  function render(){
    var items = currentStatus === 'all' ? allBookings : allBookings.filter(function(b){ return effectiveStatus(b) === currentStatus; });
    list.innerHTML = '';
    empty.hidden = items.length > 0;
    items.forEach(function(b){
      var eff = effectiveStatus(b);
      var card = document.createElement('div');
      card.className = 'bkg-card rounded-sm bg-white p-5';
      var periodLabel = b.period === 'short' ? 'Short Rental' : 'Monthly Rental';
      var passengers = b.adults + ' adult(s)' + (b.children > 0 ? ', ' + b.children + ' child(ren)' : '');
      var holdInfo = b.status === 'held' ? '<p class="text-xs text-ink-500 mt-1">Hold expires: ' + escapeHtml(b.hold_expires_at || '') + '</p>' : '';
      var optional = [
        b.country ? ['Country', b.country] : null,
        b.id_number ? ['ID/Passport', b.id_number] : null,
        b.licence_number ? ["Driver's licence", b.licence_number] : null,
        b.notes ? ['Notes', b.notes] : null
      ].filter(Boolean).map(function(pair){
        return '<div><dt class="text-[0.65rem] uppercase tracking-wide text-ink-500">' + escapeHtml(pair[0]) + '</dt><dd class="text-sm text-ink-800">' + escapeHtml(pair[1]) + '</dd></div>';
      }).join('');

      card.innerHTML =
        '<div class="flex items-start justify-between gap-4 mb-3 flex-wrap">' +
          '<div>' +
            '<div class="flex items-center gap-2 flex-wrap">' +
              '<span class="font-semibold text-ink-950">' + escapeHtml(b.name) + '</span>' +
              '<span class="bkg-badge ' + eff + '">' + eff + '</span>' +
              '<span class="bkg-dep ' + b.deposit_status + '">deposit ' + b.deposit_status + '</span>' +
            '</div>' +
            '<p class="text-xs text-ink-500 mt-1">Ref QCR-' + String(b.id).padStart(4, '0') + ' · ' + escapeHtml(b.created_at) + '</p>' +
          '</div>' +
          '<div class="text-right text-sm text-ink-700">' +
            '<div>' + escapeHtml(periodLabel) + '</div>' +
            '<div>N$' + b.deposit_amount + ' deposit</div>' +
          '</div>' +
        '</div>' +
        '<div class="grid gap-3 sm:grid-cols-2 mb-3">' +
          '<div><dt class="text-[0.65rem] uppercase tracking-wide text-ink-500">Pickup</dt><dd class="text-sm text-ink-800">' + escapeHtml(b.pickup_date) + ' ' + escapeHtml(b.pickup_time) + ' — ' + escapeHtml(b.pickup_location) + '</dd></div>' +
          '<div><dt class="text-[0.65rem] uppercase tracking-wide text-ink-500">Return</dt><dd class="text-sm text-ink-800">' + escapeHtml(b.return_date) + ' ' + escapeHtml(b.return_time) + ' — ' + escapeHtml(b.return_location) + '</dd></div>' +
          '<div><dt class="text-[0.65rem] uppercase tracking-wide text-ink-500">Passengers</dt><dd class="text-sm text-ink-800">' + escapeHtml(passengers) + '</dd></div>' +
          '<div><dt class="text-[0.65rem] uppercase tracking-wide text-ink-500">Contact</dt><dd class="text-sm text-ink-800">' + escapeHtml(b.email) + ' · ' + escapeHtml(b.phone) + '</dd></div>' +
          optional +
        '</div>' +
        holdInfo +
        '<div class="flex items-center justify-end gap-2 mt-3 flex-wrap" data-id="' + b.id + '">' +
          (b.status !== 'confirmed' ? '<button class="act px-3 py-1.5 text-xs rounded-sm bg-green-600 text-white" data-action="confirm">Confirm</button>' : '') +
          (b.deposit_status !== 'paid' ? '<button class="act px-3 py-1.5 text-xs rounded-sm bg-emerald-700 text-white" data-action="markPaid">Mark Deposit Paid</button>' : '') +
          (b.status !== 'cancelled' ? '<button class="act px-3 py-1.5 text-xs rounded-sm bg-amber-600 text-white" data-action="cancel">Cancel</button>' : '') +
          '<button class="act px-3 py-1.5 text-xs rounded-sm bg-red-700 text-white" data-action="delete">Delete</button>' +
        '</div>';
      list.appendChild(card);
    });
  }

  list.addEventListener('click', function(e){
    var btn = e.target.closest('.act');
    if (!btn) return;
    var id = btn.parentElement.dataset.id;
    var action = btn.dataset.action;
    if (action === 'delete' && !confirm('Delete this booking permanently?')) return;
    if (action === 'cancel' && !confirm('Cancel this booking? This releases the held dates.')) return;
    fetch(API_BASE + '/' + id + '?token=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: action })
    }).then(load);
  });

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
})();
</script>
</body></html>
